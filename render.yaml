services:
  # Servicio Backend en Render (FastAPI + Uvicorn)
  - type: web
    name: veterinaria-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: HOST
        value: db.kjudticyywskfteezcog.supabase.co
      - key: PORT
        value: 5432
      - key: DATABASE
        value: postgres
      - key: USER
        value: postgres
      - key: PASSWORD
        sync: false  # Se solicita en el dashboard de Render por seguridad
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false

  # Servicio Frontend en Render (React + Vite SPA)
  - type: web
    name: veterinaria-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

