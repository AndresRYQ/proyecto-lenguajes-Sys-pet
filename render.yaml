services:
  # Servicio Backend en Render (FastAPI + Uvicorn)
  - type: web
    name: veterinaria-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /ready
    envVars:
      - key: HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DATABASE
        value: postgres
      - key: USER
        sync: false
      - key: PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://veterinaria-frontend.onrender.com
      - key: DEBUG
        value: false

  # Servicio Frontend en Render (React + Vite SPA)
  - type: web
    name: veterinaria-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://veterinaria-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

